name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement de déploiement"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/

  test:
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-26.04
          - windows-2025
        node-version:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}

    steps:
      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/

      - name: Deploy
        run: |
          echo "API_URL: ${{ vars.API_URL }}"

      - name: Deploy Summary
        run: |
          echo "## Déploiement" >> "$GITHUB_STEP_SUMMARY"
          echo "Cible : ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "URL : ${{ vars.API_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit : ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
